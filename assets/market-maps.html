<style>
:root{--bg:#f8fafc;--fg:#0f172a;--mut:#64748b;--card:#fff;--line:#e2e8f0}

body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Arial,sans-serif}

function collect(m,only){
 var by={};
 function add(id,u,g,t){var o=by[id]||(by[id]={core:[],potential:[],no:[],tech:[]});if(g&&o[g])o[g].push(u);if(t)o.tech.push(u)}
 Object.keys(m.data).forEach(function(u){if(only&&u!==only)return;var d=m.data[u]||{};Object.keys(d).forEach(function(id){var e=d[id]||{};add(id,u,e.g,e.t)})});
 return by}
function status(o){return !o?'na':o.core.length?'core':o.potential.length?'potential':o.no.length?'no':'na'}
function byName(a,b){a=a.toLowerCase();b=b.toLowerCase();return a<b?-1:a>b?1:0}
function tally(m,only){var by=collect(m,only),c={core:0,potential:0,rated:0};
 Object.keys(by).forEach(function(id){var s=status(by[id]);if(s==='core')c.core++;else if(s==='potential')c.potential++;if(s!=='na')c.rated++});return c}
function buildPanel(m){
 if(!btn)return;
 var opts=[['','Anyone']].concat(m.users.map(function(u){return [u,u]}));
 pan.innerHTML=opts.map(function(o){var c=tally(m,o[0]);
  return '<label'+(o[0]?'':' title="Core if anyone rates the company core, otherwise potential if anyone rates it potential"')+'><input type="radio" name="mmwho" value="'+esc(o[0])+'"'+(o[0]===who?' checked':'')+'><span>'+esc(o[1])+'<span class="mc">'+(c.rated?c.core+' core · '+c.potential+' potential':'no assessments yet')+'</span></span></label>'}).join('');
 btn.textContent='Benchmarks by: '+(who||'Anyone');btn.classList.toggle('sel',!!who)}
function closeAll(){document.querySelectorAll('.msp').forEach(function(p){p.hidden=true});if(btn)btn.setAttribute('aria-expanded','false')}
function mkCtl(){
 var host=document.querySelector('.ctl');if(!host)return;
 var w=document.createElement('div');w.className='ms';w.id='ms_who';
 btn=document.createElement('button');btn.type='button';btn.className='msb';btn.setAttribute('aria-haspopup','true');btn.setAttribute('aria-expanded','false');btn.textContent='Benchmarks by: Anyone';w.appendChild(btn);
 pan=document.createElement('div');pan.className='msp whop';pan.hidden=true;document.body.appendChild(pan);
 host.insertBefore(w,host.firstChild);
 btn.addEventListener('click',function(ev){ev.stopPropagation();var open=pan.hidden;closeAll();if(open){var r=btn.getBoundingClientRect();pan.style.top=r.bottom+4+'px';pan.hidden=false;pan.style.left=Math.max(8,Math.min(r.left,innerWidth-pan.offsetWidth-8))+'px';btn.setAttribute('aria-expanded','true')}});
 pan.addEventListener('click',function(ev){ev.stopPropagation()});
 pan.addEventListener('change',function(ev){var i=ev.target;if(i&&i.name==='mmwho'){who=i.value;force=true;closeAll();refresh()}});
 document.addEventListener('keydown',function(ev){if(ev.key==='Escape')closeAll()})}
function refresh(){
 var raw=readRaw();if(seen&&raw===last&&!force)return;seen=true;last=raw;force=false;
 var m=model(raw);if(who&&m.users.indexOf(who)<0)who='';
 buildPanel(m);
 var by=collect(m,who),st={},names={};
 document.querySelectorAll('g.chip').forEach(function(g){
  var id=g.dataset.id,o=by[id],s=status(o),tech=!!(o&&o.tech.length),c=g.dataset.cl;
  ['core','potential','no','na'].forEach(function(k){g.classList.remove('s-'+k)});
  g.classList.add('s-'+s);g.classList.toggle('tech',tech);
  var t=g.querySelector('title');
  if(t){var out=[];t.textContent.split('\n').forEach(function(l){
    if(l.indexOf('Tech benchmark:')===0)return;
    if(l.indexOf('GTM assessment:')===0){out.push('GTM assessment: '+LBL[s]+(o&&s!=='na'?' ('+o[s].join(', ')+')':''));if(tech)out.push('Tech benchmark: '+o.tech.join(', '));return}
    out.push(l)});t.textContent=out.join('\n')}
  st[id]=s;
  var n=names[c]||(names[c]={core:[],potential:[],no:[]});if(n[s])n[s].push(g.dataset.short||g.dataset.name)});
 document.querySelectorAll('text.gtmc').forEach(function(el){
  var n=names[el.dataset.cl]||{core:[],potential:[]},p=[];
  if(n.core.length)p.push(n.core.length+' core GTM');if(n.potential.length)p.push(n.potential.length+' potential GTM');
  el.textContent=p.join(', ')});
 document.querySelectorAll('#p4 tr[data-cl]').forEach(function(tr){
  var n=names[tr.dataset.cl]||{core:[],potential:[],no:[]},cp=tr.querySelector('td.cp'),mem=tr.querySelector('td.mem');
  if(cp)cp.textContent=n.core.length+' / '+n.potential.length;
  if(mem){mem.textContent='';[['vr',n.core],['rl',n.potential],['na',n.no]].forEach(function(x,i){
    if(i)mem.appendChild(document.createTextNode(' '));
    var sp=document.createElement('span');sp.className=x[0];sp.textContent=x[1].slice().sort(byName).join(', ');mem.appendChild(sp)})}});
 document.querySelectorAll('#ft tbody tr[data-id]').forEach(function(tr){
  var s=st[tr.dataset.id]||'na',td=tr.cells[0],old=td.querySelector('div.sub');
  tr.dataset.a=(s==='core'||s==='potential')?'1':'0';
  if(old)td.removeChild(old);
  if(SUB[s]){var d=document.createElement('div');d.className='sub';d.textContent=SUB[s];td.appendChild(d)}});
 if(typeof both==='function')both()}
window.addEventListener('storage',function(e){if(e.key===null||e.key===KEY)refresh()});
document.addEventListener('visibilitychange',refresh);
setInterval(refresh,1500);
mkCtl();
refresh();
})();
</script></body></html>
