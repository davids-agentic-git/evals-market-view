<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Methodology · Compliance Evals for Agentic Behavior</title>
  <link rel="canonical" href="methodology-market-scan.html">
  <noscript><meta http-equiv="refresh" content="0; url=methodology-market-scan.html"></noscript>
  <script>
    // The Methodology tabs became four pages. Old links keep their tab or section.
    (() => {
      const pages = { 'market-scan': 'methodology-market-scan.html', 'value-levers': 'methodology-value-levers.html', 'eval-scope': 'methodology-eval-scope.html', 'other-attributes': 'methodology-other-attributes.html' };
      const tabs = { framework: 'eval-scope', 'lever-test': 'value-levers', 'lever-observe': 'value-levers', 'lever-assure': 'value-levers' };
      const prefixes = [['ms-', 'market-scan'], ['vl-', 'value-levers'], ['lever-', 'value-levers'], ['fw-', 'eval-scope'], ['dim-', 'eval-scope'], ['at-', 'other-attributes'], ['attr-', 'other-attributes']];
      const id = decodeURIComponent(location.hash.slice(1));
      let page = pages['market-scan'], hash = '';
      if (pages[id]) page = pages[id];
      else if (tabs[id]) page = pages[tabs[id]];
      else {
        const hit = prefixes.find(([p]) => id.startsWith(p));
        if (hit) { page = pages[hit[1]]; hash = '#' + id; }
      }
      location.replace(page + location.search + hash);
    })();
  </script>
</head>
<body>
  <p>Methodology is now four pages: <a href="methodology-market-scan.html">Market Scan</a>, <a href="methodology-value-levers.html">Value Levers</a>, <a href="methodology-eval-scope.html">Eval Scope</a> and <a href="methodology-other-attributes.html">Other Attributes</a>.</p>
</body>
</html>
